<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none" class="w-auto h-10">
  <!-- Baltic Waves Crest & Feline Monogram -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(4, 5)">
    <!-- Outer Shield / Circle with gold border -->
    <rect x="0" y="0" width="50" height="50" rx="14" fill="#0B192C" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Stylized Baltic wave + cat ears silhouette -->
    <!-- Left ear -->
    <path d="M 12 18 L 19 28 L 14 28 Z" fill="url(#goldGrad)"/>
    <!-- Right ear -->
    <path d="M 38 18 L 31 28 L 36 28 Z" fill="url(#goldGrad)"/>
    <!-- Cat crown / Baltic wave -->
    <path d="M 15 32 C 20 25, 30 25, 35 32 C 32 37, 18 37, 15 32 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 11 38 C 17 33, 25 43, 39 36" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="27" r="2" fill="#D97706"/>
  </g>

  <!-- Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="0.08em" fill="#FFFFFF">
    BALTICA
  </text>
  <text x="178" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="300" font-size="14" letter-spacing="0.25em" fill="#D97706">
    FELINE
  </text>
  <text x="64" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="0.32em" fill="#94A3B8">
    CLINICAL NUTRITION • BALTIC SEA
  </text>
</svg>
